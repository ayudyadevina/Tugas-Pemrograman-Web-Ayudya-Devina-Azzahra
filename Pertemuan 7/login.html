<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Lembar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <div class="container">
      <div class="row justify-content-center">
        <!-- col-md-7 col-lg-5: lebar kartu menyesuaikan ukuran layar -->
        <div class="col-11 col-md-7 col-lg-5">

          <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
              <h1 class="h2" style="color: var(--cokelat);"><i class="bi bi-book-half me-1"></i>Lembar</h1>
            </a>
          </div>

          <div class="card auth-card p-4 p-md-5">
            <h2 class="h3 text-center mb-1">Selamat datang kembali</h2>
            <p class="text-center text-secondary small mb-4">Masuk untuk melanjutkan bacaanmu.</p>

            <form class="needs-validation" id="formLogin" novalidate>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
                <div class="invalid-feedback">Masukkan email yang valid.</div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Kata sandi</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" placeholder="Kata sandi kamu" minlength="6" required>
                  <button class="btn btn-outline-lembar" type="button" id="tombolLihat" aria-label="Tampilkan kata sandi">
                    <i class="bi bi-eye" id="ikonMata"></i>
                  </button>
                  <div class="invalid-feedback">Kata sandi minimal 6 karakter.</div>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="ingatSaya">
                  <label class="form-check-label small" for="ingatSaya">Ingat saya</label>
                </div>
                <a href="#" class="small">Lupa kata sandi?</a>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-lembar btn-lg">Masuk</button>
              </div>
            </form>

            <p class="text-center small mt-4 mb-0">
              Belum punya akun? <a href="register.html" class="fw-semibold">Daftar di sini</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Validasi form Bootstrap
    const form = document.getElementById('formLogin');
    form.addEventListener('submit', function (event) {
      event.preventDefault(); 
      if (!form.checkValidity()) {
        event.stopPropagation();
      } else {
        alert('Login berhasil! (contoh saja, belum terhubung ke database)');
        window.location.href = 'index.html';
      }
      form.classList.add('was-validated');
    });

    // Tombol mata
    const inputPassword = document.getElementById('password');
    const ikonMata = document.getElementById('ikonMata');
    document.getElementById('tombolLihat').addEventListener('click', function () {
      const tersembunyi = inputPassword.type === 'password';
      inputPassword.type = tersembunyi ? 'text' : 'password';
      ikonMata.className = tersembunyi ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  </script>
</body>
</html>
