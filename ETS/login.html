<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | LibraryReg</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">

  <nav class="navbar navbar-expand-xl sticky-top site-header" data-bs-theme="dark" aria-label="Navigasi utama">
    <div class="container-fluid site-header__inner">
      <a class="navbar-brand brand" href="index.html" aria-label="LibraryReg, kembali ke beranda">
        <svg class="brand__logo" viewBox="0 0 64 40" aria-hidden="true">
          <path fill="#fff" d="M32 9C26 4.5 14 3 2 5.5v26c12-2.5 24-1 30 4z"/>
          <path fill="#fff" d="M32 9c6-4.5 18-6 30-3.5v26c-12-2.5-24-1-30 4z"/>
          <path fill="none" stroke="#0f4d92" stroke-width="1.6" stroke-linecap="round" d="M7 12c8-1.2 16 0 22 3M7 18c8-1.2 16 0 22 3M57 12c-8-1.2-16 0-22 3M57 18c-8-1.2-16 0-22 3"/>
        </svg>
        <span class="brand__text">
          <span class="brand__name">LibraryReg</span>
          <span class="brand__tagline">Perpustakaan Universitas</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primary-nav"
              aria-controls="primary-nav" aria-expanded="false" aria-label="Buka menu navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-xl-end" id="primary-nav">
        <ul class="navbar-nav align-items-xl-center gap-xl-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#services">Service</a></li>
          <li class="nav-item"><a class="nav-link" href="members.html">Members List</a></li>
          <li class="nav-item"><a class="nav-link" href="registration.html">Registration</a></li>
          <li class="nav-item"><a class="btn btn-login" id="nav-auth" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <header class="page-hero">
      <div class="container">
        <h1 class="section-title">Login Petugas</h1>
        <p>Masuk untuk mengelola data anggota perpustakaan.</p>
      </div>
    </header>

    <section class="page-section">
      <div class="container">
        <div class="panel mx-auto" style="max-width: 460px;">
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="login-username">Username</label>
              <input class="form-control" id="login-username" name="username" type="text"
                     autocomplete="username" required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="login-password">Kata Sandi</label>
              <div class="input-group">
                <input class="form-control" id="login-password" name="password" type="password"
                       autocomplete="current-password" required>
                <button class="btn btn-brand-outline btn-compact" type="button" id="toggle-password"
                        aria-pressed="false">Tampilkan</button>
                <div class="invalid-feedback"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 mt-2">Login</button>

            <p class="small text-muted mt-3 mb-0">
              Akun demo: <strong>petugas</strong> / <strong>perpus123</strong>
            </p>
            <p class="small mt-2 mb-0">Belum menjadi anggota? <a href="registration.html">Daftar di sini</a></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center small">&copy; 2026 LibraryReg — Perpustakaan Universitas</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
